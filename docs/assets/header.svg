<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" fill="#0d0d12"/>

  <!-- Left: data blocks -->
  <rect x="60" y="52" width="80" height="14" rx="4" fill="#a78bfa" opacity="0.3"/>
  <rect x="60" y="76" width="120" height="14" rx="4" fill="#a78bfa" opacity="0.2"/>
  <rect x="60" y="100" width="64" height="14" rx="4" fill="#a78bfa" opacity="0.15"/>
  <rect x="60" y="124" width="100" height="14" rx="4" fill="#a78bfa" opacity="0.25"/>
  <rect x="60" y="148" width="88" height="14" rx="4" fill="#a78bfa" opacity="0.2"/>
  <rect x="60" y="172" width="72" height="14" rx="4" fill="#a78bfa" opacity="0.15"/>
  <rect x="60" y="196" width="110" height="14" rx="4" fill="#a78bfa" opacity="0.2"/>

  <!-- Transition arrow -->
  <path d="M260 130 C340 130, 380 80, 440 40 C500 0, 560 0, 620 40 C680 80, 720 130, 800 130" stroke="url(#arrow)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Center: abstract transformation shapes -->
  <circle cx="440" cy="130" r="24" fill="url(#g1)" opacity="0.4"/>
  <circle cx="520" cy="100" r="16" fill="url(#g2)" opacity="0.5"/>
  <circle cx="560" cy="140" r="20" fill="url(#g3)" opacity="0.35"/>
  <circle cx="600" cy="110" r="12" fill="url(#g4)" opacity="0.45"/>
  <circle cx="640" cy="130" r="18" fill="url(#g5)" opacity="0.3"/>

  <!-- Right: rendered page layout -->
  <g transform="translate(740, 60)">
    <!-- Page container -->
    <rect x="0" y="0" width="160" height="200" rx="8" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="1"/>

    <!-- Header bar -->
    <rect x="12" y="12" width="136" height="8" rx="3" fill="#60a5fa" opacity="0.5"/>

    <!-- Hero block -->
    <rect x="12" y="30" width="136" height="40" rx="4" fill="#a78bfa" opacity="0.2"/>
    <rect x="20" y="38" width="80" height="6" rx="2" fill="#a78bfa" opacity="0.5"/>
    <rect x="20" y="50" width="100" height="4" rx="2" fill="#a78bfa" opacity="0.3"/>

    <!-- Content blocks -->
    <rect x="12" y="80" width="136" height="6" rx="2" fill="#ffffff" opacity="0.08"/>
    <rect x="12" y="92" width="120" height="6" rx="2" fill="#ffffff" opacity="0.06"/>
    <rect x="12" y="104" width="100" height="6" rx="2" fill="#ffffff" opacity="0.05"/>

    <!-- Image placeholder -->
    <rect x="12" y="120" width="136" height="32" rx="3" fill="#34d399" opacity="0.1"/>

    <!-- More text -->
    <rect x="12" y="160" width="130" height="5" rx="2" fill="#ffffff" opacity="0.07"/>
    <rect x="12" y="170" width="110" height="5" rx="2" fill="#ffffff" opacity="0.05"/>
    <rect x="12" y="180" width="90" height="5" rx="2" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- Label -->
  <text x="120" y="270" text-anchor="middle" fill="#a78bfa" opacity="0.3" font-family="system-ui, sans-serif" font-size="12" letter-spacing="4">DATA</text>
  <text x="800" y="270" text-anchor="middle" fill="#34d399" opacity="0.3" font-family="system-ui, sans-serif" font-size="12" letter-spacing="4">WEBSITE</text>
</svg>