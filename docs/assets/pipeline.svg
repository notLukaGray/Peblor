<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" fill="none">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="flowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="15%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="240" fill="#0d0d12"/>

  <!-- Flow line -->
  <path d="M0 120 C120 120, 160 80, 240 100 C320 120, 360 140, 440 100 C520 60, 560 100, 640 100 C720 100, 760 120, 840 100 C880 90, 920 110, 960 120" stroke="url(#flowFade)" stroke-width="3" fill="none" filter="url(#glow)"/>

  <!-- Stage 1: Load -->
  <g transform="translate(80, 0)">
    <circle cx="60" cy="100" r="28" fill="#a78bfa" opacity="0.08"/>
    <circle cx="60" cy="100" r="18" fill="#a78bfa" opacity="0.15"/>
    <circle cx="60" cy="100" r="8" fill="#a78bfa" opacity="0.4"/>
    <text x="60" y="152" text-anchor="middle" fill="#a78bfa" opacity="0.5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">LOAD</text>
  </g>

  <!-- Stage 2: Validate -->
  <g transform="translate(240, 0)">
    <circle cx="60" cy="100" r="28" fill="#818cf8" opacity="0.08"/>
    <circle cx="60" cy="100" r="18" fill="#818cf8" opacity="0.15"/>
    <circle cx="60" cy="100" r="8" fill="#818cf8" opacity="0.4"/>
    <text x="60" y="152" text-anchor="middle" fill="#818cf8" opacity="0.5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">VALIDATE</text>
  </g>

  <!-- Stage 3: Expand -->
  <g transform="translate(400, 0)">
    <circle cx="60" cy="100" r="28" fill="#60a5fa" opacity="0.08"/>
    <circle cx="60" cy="100" r="18" fill="#60a5fa" opacity="0.15"/>
    <circle cx="60" cy="100" r="8" fill="#60a5fa" opacity="0.4"/>
    <text x="60" y="152" text-anchor="middle" fill="#60a5fa" opacity="0.5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">EXPAND</text>
  </g>

  <!-- Stage 4: Resolve -->
  <g transform="translate(560, 0)">
    <circle cx="60" cy="100" r="28" fill="#34d399" opacity="0.08"/>
    <circle cx="60" cy="100" r="18" fill="#34d399" opacity="0.15"/>
    <circle cx="60" cy="100" r="8" fill="#34d399" opacity="0.4"/>
    <text x="60" y="152" text-anchor="middle" fill="#34d399" opacity="0.5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">RESOLVE</text>
  </g>

  <!-- Stage 5: Render -->
  <g transform="translate(720, 0)">
    <circle cx="60" cy="100" r="28" fill="#fbbf24" opacity="0.08"/>
    <circle cx="60" cy="100" r="18" fill="#fbbf24" opacity="0.15"/>
    <circle cx="60" cy="100" r="8" fill="#fbbf24" opacity="0.4"/>
    <text x="60" y="152" text-anchor="middle" fill="#fbbf24" opacity="0.5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">RENDER</text>
  </g>

  <!-- Input label -->
  <text x="40" y="56" text-anchor="middle" fill="#ffffff" opacity="0.12" font-family="system-ui, sans-serif" font-size="10" letter-spacing="3">DATA</text>
  <!-- Output label -->
  <text x="920" y="56" text-anchor="middle" fill="#ffffff" opacity="0.12" font-family="system-ui, sans-serif" font-size="10" letter-spacing="3">PAGE</text>

  <!-- Subtle connecting dots -->
  <circle cx="196" cy="100" r="2" fill="#a78bfa" opacity="0.2"/>
  <circle cx="356" cy="100" r="2" fill="#818cf8" opacity="0.2"/>
  <circle cx="516" cy="100" r="2" fill="#60a5fa" opacity="0.2"/>
  <circle cx="676" cy="100" r="2" fill="#34d399" opacity="0.2"/>
</svg>