id: trigger.onVideoEnd
kind: trigger
package: "@pb/contracts"
stability: stable
schema_version: 1

feels_like: >
  Fires when a video reaches the end of its playback. Wire to show end-state
  CTAs, loop controls, post-roll content, or analytics completion events.
  Only meaningful when the video does not loop.

not_this_if:
  - "you need to trigger on play (use trigger.onVideoPlay)"
  - "you need to trigger on pause (use trigger.onVideoPause)"

axes:
  - name: config
    fields: []
    note: "no dedicated schema field — wired via module slot visibleWhen: ['ended'] or action bindings"

covers:
  - description: "CTA and end-screen overlay shown when non-looping video finishes"
    example: content/presets/trigger-video-end.json

does_not_cover:
  - what: "Video play event"
    use_instead: trigger.onVideoPlay
  - what: "Video pause event"
    use_instead: trigger.onVideoPause
  - what: "Intersection-based trigger"
    use_instead: trigger.onVisible
  - what: "Timer-based trigger"
    use_instead: trigger.timer

composes_with:
  parents: [module]
  siblings_typical: [trigger.onVideoPlay, trigger.onVideoPause]
  motion: "N/A — player state drives slot visibility"

known_limitations:
  - "Does not fire when video is set to loop — loop restart is not an 'end' event"
  - "Requires module contextType: 'video'"

proposal_hints:
  new_variant_value: "N/A — trigger, no variant"
  new_field_in_existing_axis: extend_cluster
  new_axis: "usually new_cluster — justify before adding"
