name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + Format + Intent Cross-Check ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Assert Next.js build output is not committed
        run: |
          if git ls-files | grep -qF '.next/'; then
            echo 'Tracked files under .next/ — remove from git and add to .gitignore.' >&2
            git ls-files | grep -F '.next/' || true
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Fetch base branch for intent cross-check
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Intent-proposal cross-check
        run: npm run check:intent-proposal-cross

      - name: Run knip
        run: npm run knip

  # ── Type Check ──────────────────────────────────────────────────────
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  # ── Content Validation + Catalog + Boundaries + Schemas ────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate pages
        run: npm run validate-pages

      - name: Validate content
        run: npm run validate-content

      - name: Audit section key collisions
        run: npm run audit-section-key-collisions

      - name: Audit preset key collisions
        run: npm run audit-preset-key-collisions

      - name: Check boundaries
        run: npx tsx scripts/check-boundaries.ts

      - name: Check schemas fresh
        run: npm run check:schemas-fresh

      - name: Catalog check coverage
        run: npm run catalog:check-coverage

      - name: Catalog build CI
        run: npm run catalog:build:ci

      - name: Propose check-all
        run: npm run pb-cli -- propose --check-all

  # ── Build + Budget Checks ──────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    env:
      CDN_SIGNING_MODE: public

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'apps/web/src/**/*', 'apps/web/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Route budget check
        run: npm run check:route-budgets

      - name: Web vitals check
        run: npm run check:web-vitals

  # ── E2E + Lighthouse ───────────────────────────────────────────────────────
  # Local-only — both are machine-sensitive (timing, CPU throttling).
  # E2E runs as warn-only in the Husky pre-push hook.
  # Lighthouse: npm run check:lighthouse (requires production build + start)
